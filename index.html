  <body>
    <!-- launch: scripts/build-icons.ts -->
    <div id="launch" aria-hidden="true">
    <div class="launch-pile">
      <div class="launch-card" style="translate: calc(10 * var(--u)) calc(46 * var(--u)); rotate: -5deg"><picture><source media="(prefers-color-scheme: dark)" srcset="/launch/mint-dark.webp" /><img src="/launch/mint-light.webp" alt="" /></picture></div>
      <div class="launch-card" style="translate: calc(-8 * var(--u)) calc(33 * var(--u)); rotate: 4deg"><picture><source media="(prefers-color-scheme: dark)" srcset="/launch/blue-dark.webp" /><img src="/launch/blue-light.webp" alt="" /></picture></div>
      <div class="launch-card" style="translate: calc(6 * var(--u)) calc(20 * var(--u)); rotate: -3deg"><picture><source media="(prefers-color-scheme: dark)" srcset="/launch/pink-dark.webp" /><img src="/launch/pink-light.webp" alt="" /></picture></div>
      <div class="launch-card" style="translate: calc(-4 * var(--u)) calc(8 * var(--u)); rotate: 2.5deg"><picture><source media="(prefers-color-scheme: dark)" srcset="/launch/yellow-dark.webp" /><img src="/launch/yellow-light.webp" alt="" /></picture></div>
      <div class="launch-card launch-top" style="translate: calc(0 * var(--u)) calc(-6 * var(--u)); rotate: -1.2deg"><div class="launch-flip"><div class="launch-front"><picture><source media="(prefers-color-scheme: dark)" srcset="/launch/top-dark.webp" /><img src="/launch/top-light.webp" alt="" /></picture></div></div></div>
    </div>
    </div>
    <style>
      #launch { position: fixed; inset: 0; z-index: 20; pointer-events: none; background: url(/launch/fibre.png) 0 0 / 256px, url(/launch/mottle.png) 0 0 / 1024px, #a9bfa3; }
      @media (prefers-color-scheme: dark) { #launch { background-color: #2f3431; } }
      .launch-pile { position: absolute; left: calc(var(--cx) - 220 * var(--u)); top: calc(var(--cy) - 290 * var(--u)); width: calc(440 * var(--u)); height: calc(580 * var(--u)); }
      .launch-card { position: absolute; left: calc(-90 * var(--u)); top: calc(-90 * var(--u)); width: calc(620 * var(--u)); height: calc(760 * var(--u)); }
      .launch-shuffling .launch-card { transition: translate 0.42s cubic-bezier(0.3, 0.7, 0.3, 1), rotate 0.42s cubic-bezier(0.3, 0.7, 0.3, 1); }
      .launch-card picture, .launch-card img { display: block; width: 100%; height: 100%; }
      .launch-top { z-index: 10; perspective: calc(1600 * var(--u)); }
      .launch-flip, .launch-front { position: absolute; inset: 0; transform-style: preserve-3d; }
      .launch-front { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
      .launch-back { position: absolute; left: calc(90 * var(--u)); top: calc(90 * var(--u)); width: calc(440 * var(--u)); height: calc(580 * var(--u)); transform: rotateY(180deg); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
      .launch-note { position: absolute; left: calc(130 * var(--u)); right: calc(130 * var(--u)); top: calc(450 * var(--u)); display: grid; justify-items: center; gap: calc(8 * var(--u)); color: rgb(52 56 60 / 0.78); font: calc(27 * var(--u)) "Balsamiq Sans", system-ui, sans-serif; text-align: center; }
      .launch-note svg { width: 100%; height: calc(18 * var(--u)); overflow: visible; }
      .launch-note path { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 0.3s; }
    </style>
    <script>
      // The pile where the iOS splash draws it: 60% of the screen's width (at most 270 px), centred at 46% of
      // its height. On iOS from the home screen the page may start below the status bar: placed against the screen, not the page.
      (function () {
        var l = document.getElementById("launch"), st = navigator.standalone && innerWidth < innerHeight;
        var W = st ? screen.width : innerWidth, H = st ? screen.height : innerHeight;
        l.style.setProperty("--u", Math.min(W * 0.6, 270) / 440 + "px");
        l.style.setProperty("--cx", innerWidth / 2 + "px");
        l.style.setProperty("--cy", H * 0.46 - (st ? screen.height - innerHeight : 0) + "px");
      })();
    </script>
    <!-- /launch -->
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
